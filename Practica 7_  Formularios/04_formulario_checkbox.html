<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
<h2>Formularios con checkbox</h2>
<!-- Este encabezado identifica el formulario -->
<form action="" method="post">
<!-- Este elemento contiene los datos del formulario -->
Ingresa tu nombre:
<!-- Este texto indica el dato que se solicita -->
<input type="text" name="nombre">
<!-- Este campo permite escribir el nombre -->
<br>
<!-- Este elemento hace un salto de linea -->
Selecciona los lenguajes que conozcas:
<!-- Este texto indica que se pueden seleccionar lenguajes -->
<br>
<!-- Este elemento hace un salto de linea -->
<input type="checkbox" name="Java">Java <br>
<!-- Este control permite seleccionar Java -->
<input type="checkbox" name="Python"> Python <br>
<!-- Este control permite seleccionar Python -->
<input type="checkbox" name="C#">C# <br>
<!-- Este control permite seleccionar C# -->
<input type="checkbox" name="Flutter"> Flutter <br>
<!-- Este control permite seleccionar Flutter -->
</form>
<!-- Este elemento cierra el formulario -->
</body>
</html>
