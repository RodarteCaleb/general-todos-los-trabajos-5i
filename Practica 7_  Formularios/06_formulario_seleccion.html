<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
<h2>Formularios con seleccion</h2>
<!-- Este encabezado identifica el formulario -->
<form action="" method="post">
<!-- Este elemento contiene los datos del formulario -->
Ingresa tu nombre:
<!-- Este texto indica el dato que se solicita -->
<input type="text" name="nombre">
<!-- Este campo permite escribir el nombre -->
<br>
<!-- Este elemento hace un salto de linea -->
Selecciona tu pais:
<!-- Este texto indica que se debe seleccionar un pais -->
<select name="pais">
<!-- Este elemento crea una lista de seleccion -->
<option value="1">Argentina</option>
<!-- Esta opcion corresponde a Argentina -->
<option value="2">España</option>
<!-- Esta opcion corresponde a España -->
<option value="3">Mexico</option>
<!-- Esta opcion corresponde a Mexico -->
<option value="4">Guatemala</option>
<!-- Esta opcion corresponde a Guatemala -->
<option value="5">Honduras</option>
<!-- Esta opcion corresponde a Honduras -->
<option value="6">El Salvador</option>
<!-- Esta opcion corresponde a El Salvador -->
<option value="7">Venezuela</option>
<!-- Esta opcion corresponde a Venezuela -->
<option value="8">Colombia</option>
<!-- Esta opcion corresponde a Colombia -->
</select>
<!-- Este elemento cierra la lista de seleccion -->
<br>
<!-- Este elemento hace un salto de linea -->
<input type="submit" value="enviar">
<!-- Este control permite enviar los datos -->
<input type="reset" value="borrar">
<!-- Este control permite borrar los datos escritos -->
</form>
<!-- Este elemento cierra el formulario -->
</body>
</html>
