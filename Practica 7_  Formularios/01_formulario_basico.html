<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
<h2>Ejemplo basico</h2>
<!-- Este encabezado identifica el ejemplo -->
<form action="" method="post">
<!-- Este elemento contiene los datos del formulario -->
Ingresa tu nombre:
<!-- Este texto indica el dato que se solicita -->
<input type="text" name="nombre" size="20">
<!-- Este campo permite escribir el nombre -->
<br>
<!-- Este elemento hace un salto de linea -->
<input type="submit" value="enviar">
<!-- Este control permite enviar los datos -->
</form>
<!-- Este elemento cierra el formulario -->
</body>
</html>
