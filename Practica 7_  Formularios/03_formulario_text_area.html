<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
<h2>Formulario con text area</h2>
<!-- Este encabezado identifica el formulario -->
<form action="" method="post">
<!-- Este elemento contiene los datos del formulario -->
Ingresa tu nombre:
<!-- Este texto indica el dato que se solicita -->
<input type="text" name="nombre">
<!-- Este campo permite escribir el nombre -->
<br>
<!-- Este elemento hace un salto de linea -->
Ingresa tu correo:
<!-- Este texto indica el dato que se solicita -->
<input type="email" name="correo">
<!-- Este campo permite escribir el correo -->
<br>
<!-- Este elemento hace un salto de linea -->
Ingresa tus comentarios:
<!-- Este texto indica el dato que se solicita -->
<textarea name="comentarios" rows="1" cols="10"></textarea>
<!-- Este elemento permite escribir comentarios -->
<br>
<!-- Este elemento hace un salto de linea -->
<input type="submit" value="enviar">
<!-- Este control permite enviar los datos -->
<input type="reset" value="borrar">
<!-- Este control permite borrar los datos escritos -->
</form>
<!-- Este elemento cierra el formulario -->
</body>
</html>
