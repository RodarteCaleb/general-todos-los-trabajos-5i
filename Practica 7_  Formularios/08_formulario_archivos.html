<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
<h2>Formulario con archivos</h2>
<!-- Este encabezado identifica el formulario -->
<form action="" method="post">
<!-- Este elemento contiene los datos del formulario -->
Ingresa tu nombre:
<!-- Este texto indica el dato que se solicita -->
<input type="text" name="nombre">
<!-- Este campo permite escribir el nombre -->
<br>
<!-- Este elemento hace un salto de linea -->
<input type="file" name="archivo">
<!-- Este campo permite seleccionar un archivo -->
<br>
<!-- Este elemento hace un salto de linea -->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<!-- Este boton permite enviar los datos y contiene un icono -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
<!-- Este boton permite borrar los datos y contiene un icono -->
</form>
<!-- Este elemento cierra el formulario -->
</body>
</html>
