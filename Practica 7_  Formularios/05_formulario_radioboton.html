<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
<h2>Formularios con Radioboton</h2>
<!-- Este encabezado identifica el formulario -->
<form action="" method="post">
<!-- Este elemento contiene los datos del formulario -->
Ingresa tu nombre:
<!-- Este texto indica el dato que se solicita -->
<input type="text" name="nombre">
<!-- Este campo permite escribir el nombre -->
<br>
<!-- Este elemento hace un salto de linea -->
Selecciona el maximo de estudios que tienes:
<!-- Este texto indica que se debe elegir un nivel de estudios -->
<br>
<!-- Este elemento hace un salto de linea -->
<input type="radio" name="estudios" value="1">Sin estudios <br>
<!-- Este control representa la opcion sin estudios -->
<input type="radio" name="estudios" value="2">Primaria <br>
<!-- Este control representa la opcion primaria -->
<input type="radio" name="estudios" value="3">Secundaria <br>
<!-- Este control representa la opcion secundaria -->
<input type="radio" name="estudios" value="4">Preparatoria <br>
<!-- Este control representa la opcion preparatoria -->
<input type="submit" value="enviar">
<!-- Este control permite enviar los datos -->
<input type="reset" value="borrar">
<!-- Este control permite borrar los datos escritos -->
</form>
<!-- Este elemento cierra el formulario -->
</body>
</html>
